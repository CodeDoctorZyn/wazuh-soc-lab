<!-- Centralized agent configuration for Windows agents (dc01) -->
<!-- This file is pushed by the manager to agents in the "default" group -->

<agent_config os="Windows">

  <!-- Windows Security Event Log (AD logon, Kerberos, privilege use) -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Security</location>
    <query>Event/System[EventID != 5156 and EventID != 5157 and EventID != 5158]</query>
  </localfile>

  <!-- Windows System Event Log -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>System</location>
  </localfile>

  <!-- Windows Application Event Log -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Application</location>
  </localfile>

  <!-- Sysmon operational log (process creation, network, registry) -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Microsoft-Windows-Sysmon/Operational</location>
  </localfile>

  <!-- PowerShell script block logging -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Microsoft-Windows-PowerShell/Operational</location>
  </localfile>

  <!-- File integrity monitoring for SYSVOL and NTDS -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>
    <directories realtime="yes" check_all="yes">C:\Windows\SYSVOL</directories>
    <directories realtime="yes" check_all="yes">C:\Windows\System32\config</directories>
    <directories realtime="yes" check_all="yes">C:\Windows\System32\GroupPolicy</directories>
  </syscheck>

</agent_config>
